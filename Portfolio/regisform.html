<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
</head>
<body>
    <link rel="stylesheet" href="style.css.css">

    <center>
    <h1>My Personal Website</h1>
    <h4 style="font-family: Calibri;">Welcome to my Personal Student Portal</h4>
    </center>

    <Nav align="center">
        <a href="indeex.html">Home</a> |
        <a href="regisform.html">Registration</a> |
        <a href="grade.html">Grades</a> |
        <a href="myinformation.html">Profile</a>
    </Nav>

    <form>
    <h2>Student Registration Form</h2>

    Student Name <br>
    <input type="text" size="55" name="full_name" placeholder="Enter Name"><br><br>

    Email <br>
    <input type="text" size="55" name="email" placeholder="Enter Email"><br><br>

    Password <br>
    <input type="password" size="55" name="password" placeholder="Enter Password"><br><br>
    
    Gender <br>
    <input type="radio" name="gender" value="female">Female
    <input type="radio" name="gender" value="male">Male

    <p>Course</p>
    <select name="dropdown">
        <option value="BSIT" selected>BSIT</option>
        <option value="BSCS" selected>BSCS</option>
        <option value="BSHM" selected>BSHM</option>
        <option value="BSTM" selected>BSTM</option>
        <option value="BSOA" selected>BSOA</option>
        <option value="BSENTREP" selected>BSENTREP</option>
        <option value="Select Course" selected>Select Course</option>
    </select><br><br>

    Skills<br>
    <input type="checkbox" name="html" value="on">HTML
    <input type="checkbox" name="css" value="on">CSS 
    <input type="checkbox" name="javascript" value="on">JavaScript<br><br>

    Profile Picture<br>
    <input type="file" name="fileupload" accept="image/*"><br><br>

    Address <br>
    <textarea rows="5" cols="55" name="address"></textarea>

    <br><br>
    <input type="submit" name="submit" value="Submit">
    </form>

</body>
</html>
